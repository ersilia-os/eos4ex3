Status: Ready
Title: MolE molecular representation through redundancy reduced embeddings
Description: MolE converts a molecular graph into a 1,000-dimensional embedding 
  learned without labels, applying the Barlow-Twins redundancy-reduction 
  objective on top of Graph Isomorphism Network layers so that different 
  dimensions avoid encoding the same information. Olayo-Alarcon and colleagues 
  needed only 100,000 unlabelled PubChem structures, far fewer than the millions
  used by comparable pretraining schemes, and the frozen representation feeds 
  ordinary downstream classifiers well. Individual dimensions carry no direct 
  chemical interpretation.
